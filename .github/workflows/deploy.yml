name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Prepare dist-today
        run: |
          mkdir dist-today
          cp dist/today/index.html dist-today/index.html
          [ -d dist/_astro ] && cp -r dist/_astro dist-today/_astro || true
          cp dist/robots.txt dist-today/robots.txt
          echo "Sitemap: https://didmicroslopbreakwindows.today/sitemap.xml" >> dist-today/robots.txt
          cat <<EOF > dist-today/sitemap.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://didmicroslopbreakwindows.today/</loc>
              <lastmod>$(date -u +%Y-%m-%d)</lastmod>
            </url>
          </urlset>
          EOF

      - name: Prepare dist-archive
        run: |
          mkdir dist-archive
          cp dist/archive/index.html dist-archive/index.html
          [ -d dist/_astro ] && cp -r dist/_astro dist-archive/_astro || true
          cp dist/robots.txt dist-archive/robots.txt
          echo "Sitemap: https://microslopbroke.win/sitemap.xml" >> dist-archive/robots.txt
          cat <<EOF > dist-archive/sitemap.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://microslopbroke.win/</loc>
              <lastmod>$(date -u +%Y-%m-%d)</lastmod>
            </url>
          </urlset>
          EOF

      - name: Deploy today
        run: npx wrangler deploy --config wrangler.today.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy archive
        run: npx wrangler deploy --config wrangler.archive.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
